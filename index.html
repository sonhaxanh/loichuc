<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng sinh nhật Tổng giám đốc Nguyễn Văn Thuận</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ff9a9e;
            background-image: linear-gradient(120deg, #fecfef 0%, #ff9a9e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 1rem;
        }
        
        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        .card-3d-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 
                        0 0 40px rgba(0, 0, 0, 0.1) inset;
        }

        .card-cover {
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('anh_nen.png') left top/cover no-repeat;
            position: relative;
            overflow: hidden;
        }
        
        .card-cover::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.15) 2px, transparent 3px),
                radial-gradient(circle at 70% 60%, rgba(255, 215, 0, 0.15) 2px, transparent 3px),
                radial-gradient(circle at 40% 80%, rgba(255, 215, 0, 0.15) 2px, transparent 3px),
                radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.15) 2px, transparent 3px);
            background-size: 100px 100px;
            opacity: 0.8;
        }

        .card-inside {
            background-color: #FFFAF0;
            background-image: linear-gradient(transparent 95%, #fcd34d 100%);
            background-size: 100% 2rem;
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (min-width: 1024px) {
            .card-fold {
                position: relative;
            }
            .card-fold::after {
                content: '';
                position: absolute;
                top: 0;
                bottom: 0;
                left: -1px;
                width: 40px;
                background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, transparent 100%);
                pointer-events: none;
                z-index: 10;
            }
        }
    </style>
</head>
<body>

    <div class="w-full max-w-5xl flex flex-col lg:flex-row rounded-2xl lg:rounded-3xl overflow-hidden card-3d-shadow transition-transform duration-500 hover:scale-[1.01] lg:h-[550px] max-h-[95vh]">
        
        <div class="card-cover w-full lg:w-1/2 p-6 md:p-8 lg:p-10 flex flex-col items-center justify-center text-center relative z-0 min-h-[350px] lg:min-h-0">
            <div class="absolute top-4 left-4 md:top-8 md:left-8 text-4xl md:text-5xl lg:text-6xl floating" style="animation-delay: 0s; text-shadow: 2px 2px 10px rgba(0,0,0,0.3);">🎈</div>
            <div class="absolute bottom-6 right-6 md:bottom-8 md:right-8 text-5xl md:text-6xl lg:text-7xl floating" style="animation-delay: 1.5s; text-shadow: 2px 2px 10px rgba(0,0,0,0.3);">🎂</div>
            <div class="absolute top-12 right-6 md:top-16 md:right-8 text-3xl md:text-4xl lg:text-5xl floating" style="animation-delay: 0.7s; text-shadow: 2px 2px 10px rgba(0,0,0,0.3);">✨</div>
            <div class="absolute bottom-10 left-6 md:bottom-12 md:left-10 text-4xl md:text-5xl lg:text-6xl floating" style="animation-delay: 2s; text-shadow: 2px 2px 10px rgba(0,0,0,0.3);">🎁</div>
            
            <div class="relative z-10 w-full">
                <div class="text-yellow-400 mb-4 md:mb-5 flex justify-center">
                    <svg class="w-12 h-12 md:w-16 md:h-16" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2l2.4 7.4h7.6l-6 4.6 2.3 7.4-6.3-4.8-6.3 4.8 2.3-7.4-6-4.6h7.6z"/>
                    </svg>
                </div>
                
                <h1 class="font-script text-4xl md:text-5xl lg:text-6xl text-white font-bold leading-tight drop-shadow-lg mb-4">
                    Chúc Mừng<br>Sinh Nhật
                </h1>
                
                <div class="w-16 md:w-20 h-1 bg-yellow-400 mx-auto rounded-full mb-4"></div>
                
                <!-- Đã chỉnh cỡ chữ bằng với tên Nguyễn Văn Thuận và bỏ thuộc tính uppercase -->
                <h2 class="text-2xl md:text-3xl lg:text-4xl font-semibold text-yellow-300 tracking-widest drop-shadow-md">
                    Tổng Giám Đốc
                </h2>
                <h3 class="text-2xl md:text-3xl lg:text-4xl font-bold text-yellow-300 mt-2 drop-shadow-md">
                    Nguyễn Văn Thuận
                </h3>
            </div>
        </div>

        <div class="card-inside card-fold w-full lg:w-1/2 p-6 md:p-8 lg:p-10 relative flex flex-col justify-center min-h-[400px] lg:min-h-0">
            
            <div id="formContainer" class="w-full relative z-10 fade-in">
                <div class="text-center mb-5 md:mb-6">
                    <h3 class="font-script text-3xl lg:text-4xl text-rose-600 font-bold mb-2">Gửi gắm yêu thương...</h3>
                </div>

                <form id="greetingForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1" for="name">Họ tên CBNV</label>
                        <input type="text" id="name" required placeholder="Vũ Ngọc Tân" 
                            class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 placeholder-gray-400 shadow-sm backdrop-blur-sm text-sm md:text-base">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1" for="department">Phòng ban</label>
                        <input type="text" id="department" required placeholder="Phòng IT" 
                            class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 placeholder-gray-400 shadow-sm backdrop-blur-sm text-sm md:text-base">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1" for="message">Nội dung lời chúc</label>
                        <textarea id="message" required rows="6" placeholder="Kính chúc Tổng giám đốc tuổi mới..." 
                            class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 placeholder-gray-400 shadow-sm backdrop-blur-sm resize-none text-sm md:text-base"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" 
                            class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-base md:text-lg py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-300">
                            💌 Gửi Lời Chúc
                        </button>
                    </div>
                </form>
            </div>

            <div id="successMessage" class="hidden w-full text-center fade-in flex flex-col items-center justify-center h-full relative z-10">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4 md:mb-6 shadow-inner mx-auto">
                    <span class="text-4xl md:text-5xl">🎉</span>
                </div>
                <h3 class="font-script text-3xl md:text-4xl text-green-600 font-bold mb-3 md:mb-4">Tuyệt vời!</h3>
                <p class="text-gray-700 text-base md:text-lg mb-6 md:mb-8 leading-relaxed max-w-sm mx-auto">
                    Lời chúc sinh nhật chân thành của bạn đã được ghi lại trên tấm thiệp và sẽ được chuyển tới Tổng Giám Đốc Nguyễn Văn Thuận.
                </p>
                <button type="button" onclick="resetCard()" 
                    class="text-rose-500 font-semibold border-b-2 border-rose-200 hover:border-rose-500 pb-1 transition-colors text-sm md:text-base">
                    Viết thêm lời chúc khác
                </button>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('greetingForm');
        const formContainer = document.getElementById('formContainer');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            formContainer.classList.add('hidden');
            successMessage.classList.remove('hidden');

            fireConfetti();
        });

        function resetCard() {
            form.reset();
            successMessage.classList.add('hidden');
            formContainer.classList.remove('hidden');
        }

        function fireConfetti() {
            const duration = 4000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });
                
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
