<body>
    <div class="w-full max-w-5xl flex flex-col lg:flex-row rounded-2xl lg:rounded-3xl overflow-hidden card-3d-shadow mx-auto">
        
        <!-- Fix chuẩn Aspect Ratio 1:1 -->
        <div class="card-cover w-full lg:w-1/2 relative z-0" style="aspect-ratio: 1 / 1;">
        </div>

        <div class="card-inside card-fold w-full lg:w-1/2 p-6 md:p-8 lg:p-10 relative flex flex-col justify-center">
            <div id="formContainer" class="w-full relative z-10 fade-in">
                <div class="text-center mb-5 md:mb-6">
                    <h3 class="font-script text-3xl lg:text-4xl text-rose-600 font-bold mb-2">Gửi gắm yêu thương...</h3>
                </div>
                <form id="greetingForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1">Họ tên CBNV</label>
                        <input type="text" id="name" required placeholder="Vũ Ngọc Tân" class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 shadow-sm backdrop-blur-sm text-sm md:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1">Phòng ban</label>
                        <input type="text" id="department" required placeholder="Phòng IT" class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 shadow-sm backdrop-blur-sm text-sm md:text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-amber-900 mb-1">Nội dung lời chúc</label>
                        <textarea id="message" required rows="5" placeholder="Kính chúc Tổng giám đốc tuổi mới..." class="w-full bg-white/60 border-2 border-amber-200 focus:border-rose-400 focus:ring-0 rounded-xl px-4 py-2.5 outline-none transition-colors text-gray-800 shadow-sm backdrop-blur-sm resize-none text-sm md:text-base"></textarea>
                    </div>
                    <div class="pt-2">
                        <button id="submitBtn" type="submit" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-base md:text-lg py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-300">
                            💌 Gửi Lời Chúc
                        </button>
                    </div>
                </form>
            </div>
            <div id="successMessage" class="hidden w-full text-center fade-in flex flex-col items-center justify-center h-full relative z-10">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4 md:mb-6 shadow-inner mx-auto"><span class="text-4xl md:text-5xl">🎉</span></div>
                <h3 class="font-script text-3xl md:text-4xl text-green-600 font-bold mb-3 md:mb-4">Tuyệt vời!</h3>
                <p class="text-gray-700 text-base md:text-lg mb-6 md:mb-8 max-w-sm mx-auto">Lời chúc sinh nhật đã được ghi lại và gửi tới Tổng Giám Đốc.</p>
                <button type="button" onclick="location.reload()" class="text-rose-500 font-semibold border-b-2 border-rose-200 hover:border-rose-500 pb-1 text-sm md:text-base">Viết thêm lời chúc khác</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('greetingForm');
        const submitBtn = document.getElementById('submitBtn');
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyQg0n1xtZblFh3QmazDv-mP5i5nAjvBNnOPNbTPf-UrTYAtDu-EfOS5pWkAFnZnS39/exec"; 

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = "Đang gửi..."; submitBtn.disabled = true;
            const payload = { name: document.getElementById('name').value, department: document.getElementById('department').value, message: document.getElementById('message').value };
            fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => { document.getElementById('formContainer').classList.add('hidden'); document.getElementById('successMessage').classList.remove('hidden'); fireConfetti(); })
            .catch(err => { alert("Có lỗi xảy ra khi gửi dữ liệu!"); submitBtn.innerText = "💌 Gửi Lời Chúc"; submitBtn.disabled = false; });
        });

        function fireConfetti() {
            const end = Date.now() + 4000;
            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
                confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
